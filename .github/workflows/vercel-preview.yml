name: Vercel preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Vercel preview smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Configure required reviewers: this job executes the reviewed PR code.
    environment: vercel-preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Identify cloud changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" -- | node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { affectsCloud } from "./scripts/vercel-ignore-build.mjs";
            const paths = readFileSync(0, "utf8").split("\0").filter(Boolean);
            appendFileSync(process.env.GITHUB_OUTPUT, `cloud=${paths.some(affectsCloud)}\n`);
          '
      - name: Verify deployed PR preview
        if: steps.changes.outputs.cloud == 'true'
        run: node scripts/check-vercel-preview.mjs
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Explain skipped deployment check
        if: steps.changes.outputs.cloud != 'true'
        run: echo 'No cloud artifact changes; the local container checks remain in CI.'
