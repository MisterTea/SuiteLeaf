name: Deploy website & demo to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip demo]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'live demo update')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure ffmpeg is installed
        run: command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install dependencies
        run: npm ci

      - name: Build web demo application
        run: npm run build:web
        env:
          # The demo is single-node mode: files stay in this browser's storage.
          VITE_SUITELEAF_DEMO: "1"
          VITE_SUITELEAF_CAST_APP_ID: ${{ vars.VITE_SUITELEAF_CAST_APP_ID }}

      - name: Build SuiteLeaf marketing website & narrated videos
        run: npm run build:website

      - name: Record deployed commit
        run: printf '%s\n' "$GITHUB_SHA" > website/dist/deployment-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 15
        continue-on-error: true

      # GitHub Pages APIs occasionally return transient HTTP 500s. Back off
      # before retrying with the existing artifact instead of rebuilding.
      - name: Wait before retrying GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          error_count: 15
        continue-on-error: true

      - name: Wait before final GitHub Pages deployment retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Final retry of GitHub Pages deployment
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        id: deployment_retry_2
        uses: actions/deploy-pages@v4
        with:
          error_count: 15

      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            version=$(curl --fail --silent --show-error --location --connect-timeout 5 --max-time 10 \
              "${PAGE_URL%/}/deployment-version.txt?commit=$GITHUB_SHA" || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Verified live commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The live site did not serve commit $GITHUB_SHA" >&2
          exit 1
