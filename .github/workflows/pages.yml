name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip demo]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'live demo update')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build:web
        env:
          # The demo is single-node mode: files stay in this browser's storage.
          VITE_SUITELEAF_DEMO: "1"

      - name: Record deployed commit
        run: printf '%s\n' "$GITHUB_SHA" > apps/web/dist/deployment-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages can keep a valid deployment in updating_pages past its
          # default ten-minute timeout. Allow that publish to finish.
          timeout: 1800000

      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            version=$(curl --fail --silent --show-error --location --connect-timeout 5 --max-time 10 \
              "${PAGE_URL%/}/deployment-version.txt?commit=$GITHUB_SHA" || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Verified live commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The live site did not serve commit $GITHUB_SHA" >&2
          exit 1
