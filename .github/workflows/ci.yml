name: Checks and desktop builds
on:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run check:secrets
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The better-auth adapter suite runs against a real node and auth sidecar.
      - run: cargo build -p suiteleaf-node
      - run: npm run build:auth
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run setup:test-fonts
      - run: npm test
      - run: npm run build
      - run: node node_modules/electron/install.js
      - run: xvfb-run --auto-servernum npm run test:electron
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
  vercel:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suiteleaf
          POSTGRES_PASSWORD: suiteleaf-ci-password
          POSTGRES_DB: suiteleaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U suiteleaf -d suiteleaf"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Vercel container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vercel
          load: true
          tags: suiteleaf-vercel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Vercel container deployment
        env:
          DATABASE_URL: postgresql://suiteleaf:suiteleaf-ci-password@127.0.0.1:5432/suiteleaf
          SUITELEAF_AUTH_SECRET: ci-vercel-auth-secret-0123456789abcdef
        run: |
          setup=$(docker run --rm --entrypoint suiteleaf-node suiteleaf-vercel:ci setup-token)
          hash=$(node -e 'console.log(JSON.parse(process.argv[1]).hash)' "$setup")
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            --entrypoint suiteleaf-node suiteleaf-vercel:ci migrate-cloud
          docker run -d --name suiteleaf-vercel-ci --network host \
            -e PORT=8788 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SUITELEAF_AUTH_SECRET="$SUITELEAF_AUTH_SECRET" \
            -e SUITELEAF_BOOTSTRAP_TOKEN_HASH="$hash" \
            -e VERCEL_URL="suiteleaf-pr.vercel.app" \
            suiteleaf-vercel:ci
          trap 'docker logs suiteleaf-vercel-ci || true; docker rm -f suiteleaf-vercel-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if info=$(curl -fsS http://127.0.0.1:8788/api/node/info 2>/dev/null); then
              providers=$(curl -fsS http://127.0.0.1:8788/api/auth/suiteleaf/providers)
              html=$(curl -fsS http://127.0.0.1:8788/)
              node -e '
                const assert = require("node:assert/strict");
                const info = JSON.parse(process.argv[1]);
                const providers = JSON.parse(process.argv[2]);
                const html = process.argv[3];
                assert.equal(info.mode, "cluster");
                assert.equal(info.database, "postgres");
                assert.equal(info.storage, "vercel-blob");
                assert.equal(info.auth.enabled, true);
                assert.equal(providers.inviteOnly, true);
                assert(html.includes("<div id=\"root\">"));
              ' "$info" "$providers" "$html"
              trap - EXIT
              docker rm -f suiteleaf-vercel-ci >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "Vercel container did not become healthy" >&2
          exit 1
  e2e:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # The SuiteDrive browser test runs against a real node and auth sidecar.
      - run: cargo build -p suiteleaf-node
      - run: npm run build:auth
      # Form cards and the form editor stay behind this flag. The browser
      # specs open them from Home, so the preview build has to include them.
      - run: npm run build
        env:
          VITE_SUITELEAF_FORMS: "1"
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npm run package:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: SuiteLeaf-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
