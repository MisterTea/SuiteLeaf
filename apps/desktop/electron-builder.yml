appId: org.suiteleaf.app
productName: SuiteLeaf
copyright: Copyright © SuiteLeaf contributors
artifactName: SuiteLeaf-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
icon: resources/icon.png
asar: true
fileAssociations:
  - ext: sldoc
    name: SuiteLeaf Document
    mimeType: application/vnd.suiteleaf.doc+json
    role: Editor
  - ext: slsheet
    name: SuiteLeaf Spreadsheet
    mimeType: application/vnd.suiteleaf.sheet+json
    role: Editor
  - ext: slslides
    name: SuiteLeaf Presentation
    mimeType: application/vnd.suiteleaf.slides+json
    role: Editor
  - ext: suiteleaf
    name: SuiteLeaf File (legacy)
    role: Editor
mac:
  icon: resources/icon.icns
  identity: null
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  icon: resources/icon.ico
  target:
    - nsis
linux:
  executableName: suiteleaf
  category: Office
  maintainer: SuiteLeaf contributors
  target:
    - AppImage
    - deb

